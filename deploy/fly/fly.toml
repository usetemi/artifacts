# Copy this file, set `app` and `primary_region` to your app name and
# the region nearest your Fly Managed Postgres cluster, pin `image` to a
# released tag (built by .github/workflows/release.yml), and set
# APP_HOST and CONTENT_HOST to your two hostnames below. DATABASE_URL,
# SECRET_KEY_BASE, TOKEN_SIGNING_SECRET, GOOGLE_CLIENT_ID, and
# GOOGLE_CLIENT_SECRET are secrets: set them with `fly secrets set`, not
# here. See ../README.md.
app = "artifacts"
primary_region = "iad"

[build]
  image = "ghcr.io/usetemi/artifacts:v0.1.0"

[deploy]
  release_command = "/app/bin/migrate"

[env]
  # The app host serves the web app, /auth, /api, and /mcp; the content
  # host serves only the page route and the page socket. The chrome, the
  # page runtime, and the CSP's frame-ancestors all key off these, so
  # sockets and page requests from any other host are refused. Give each
  # its own DNS record and `fly certs add` certificate.
  APP_HOST = "artifacts.example.com"
  CONTENT_HOST = "artifacts-content.example.com"
  # Empty allows any verified Google account to sign up; set it to the
  # domains your instance should admit instead.
  SIGNUP_EMAIL_DOMAINS = ""
  PORT = "4000"
  # Fly's private network (used to reach Fly Managed Postgres) is
  # IPv6-only.
  ECTO_IPV6 = "true"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    # An open page's socket and a running `wait` each hold a connection
    # for as long as they stay open, not just for one request.
    soft_limit = 1000
    hard_limit = 1000

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
